<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finia — Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- STICKER OVERLAY -->
    <div class="sticker-overlay" id="stickerOverlay">
        <img src="" alt="Sticker Reaction" class="sticker-img" id="stickerImg">
    </div>

    <!-- MAIN CONTAINER -->
    <main class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <span class="logo">
                    <img src="pfp/finia.jpg" alt="Finia Logo" height="40" width="40">
                </span>
                <span class="currency-tag" id="currencyTag">¥</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
            </div>
        </header>

        <!-- BALANCE SECTION -->
        <section class="balance-section">
            <div class="balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount" id="balanceAmount">¥0.00</div>
                <div class="balance-row">
                    <div class="balance-mini income-mini">
                        <span class="mini-icon">↑</span>
                        <div>
                            <div class="mini-label">Income</div>
                            <div class="mini-amount" id="totalIncome">¥0.00</div>
                        </div>
                    </div>
                    <div class="balance-divider"></div>
                    <div class="balance-mini expense-mini">
                        <span class="mini-icon">↓</span>
                        <div>
                            <div class="mini-label">Expenses</div>
                            <div class="mini-amount" id="totalExpenses">¥0.00</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- DAILY EXPENSE ENTRY (DEFAULT) -->
        <section class="add-section">
            <h2 class="section-title">Log Daily Expense</h2>
            
            <div class="quick-presets">
                <button type="button" class="preset-chip" data-desc="Lunch" data-cat="Food & Dining">🍔 Lunch</button>
                <button type="button" class="preset-chip" data-desc="Coffee" data-cat="Food & Dining">☕ Coffee</button>
                <button type="button" class="preset-chip" data-desc="Transport" data-cat="Transport">🚗 Ride</button>
                <button type="button" class="preset-chip" data-desc="Snacks" data-cat="Food & Dining">🍿 Snacks</button>
            </div>

            <div class="form-grid">
                <input type="text" class="finia-input" id="expenseDescInput" placeholder="What did you spend on? (e.g. Lunch)">
                <input type="number" class="finia-input" id="expenseAmountInput" placeholder="Amount" min="0.01" step="0.01">
                <select class="finia-input" id="expenseCategorySelect"></select>
                <button class="add-btn expense-btn" id="addExpenseBtn">Log Expense</button>
            </div>
            <div class="form-msg" id="expenseFormMsg"></div>
        </section>

        <!-- DEDICATED INCOME ENTRY -->
        <section class="add-section">
            <h2 class="section-title">Add Income</h2>
            <div class="form-grid">
                <input type="text" class="finia-input" id="incomeDescInput" placeholder="Source (e.g. Salary, Stipend, Sold Item)">
                <input type="number" class="finia-input" id="incomeAmountInput" placeholder="Amount" min="0.01" step="0.01">
                <select class="finia-input" id="incomeCategorySelect">
                    <option value="Salary">Salary</option>
                    <option value="Stipend">Stipend</option>
                    <option value="Freelance">Freelance / Project</option>
                    <option value="Allowance">Allowance</option>
                    <option value="Selling">Sales / Sold Item</option>
                    <option value="Other Income">Other Income</option>
                </select>
                <button class="add-btn income-btn" id="addIncomeBtn">+ Add Income</button>
            </div>
            <div class="form-msg" id="incomeFormMsg"></div>
        </section>

        <!-- BUDGET ALERTS -->
        <div class="budget-alerts" id="budgetAlerts"></div>

        <!-- TRANSACTIONS LIST -->
        <section class="transactions-section">
            <div class="section-header">
                <h2 class="section-title">Transactions</h2>
                <button class="text-btn" id="exportBtn">Export CSV</button>
            </div>
            <div class="filter-row">
                <select class="filter-select" id="filterType">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
                <select class="filter-select" id="filterCategory">
                    <option value="all">All Categories</option>
                </select>
            </div>
            <ul class="transaction-list" id="transactionList">
                <li class="empty-state">No transactions yet. Add one above!</li>
            </ul>
        </section>

        <!-- CATEGORY BUDGETS -->
        <section class="budget-section">
            <h2 class="section-title">Category Budgets</h2>
            <p class="section-sub">Set monthly spending limits per category.</p>
            <div class="budget-list" id="budgetList"></div>
            <div class="budget-form">
                <select class="finia-input" id="budgetCategorySelect"></select>
                <input type="number" class="finia-input" id="budgetAmount" placeholder="Monthly limit" min="1">
                <button class="add-btn small" id="setBudgetBtn">Set</button>
            </div>
        </section>

    </main>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>

            <div class="modal-section">
                <h4>Categories</h4>
                <ul class="category-list" id="categoryList"></ul>
                <div class="category-add-form">
                    <input type="text" class="finia-input" id="newCategoryInput" placeholder="New category name">
                    <button class="add-btn small" id="addCategoryBtn">Add</button>
                </div>
            </div>

            <div class="modal-section">
                <h4>Currency</h4>
                <div class="currency-options small">
                    <button class="currency-btn active" data-symbol="¥">¥ Yen</button>
                    <button class="currency-btn" data-symbol="$">$ Dollar</button>
                    <button class="currency-btn" data-symbol="৳">৳ Taka</button>
                </div>
                <button class="add-btn small" id="saveCurrencyBtn" style="margin-top:12px">Save Currency</button>
            </div>

            <div class="modal-section danger-zone">
                <h4>Danger Zone</h4>
                <button class="danger-btn" id="resetBtn">Reset All Data</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
